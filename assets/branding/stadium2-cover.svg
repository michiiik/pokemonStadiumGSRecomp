<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Pokémon Stadium 2 Recomp</title>
  <desc id="desc">Original midnight navy, gold, and silver arena artwork for a Pokémon Stadium 2 recompilation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.55" stop-color="#102b4a"/>
      <stop offset="1" stop-color="#050b18"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="57%" r="55%">
      <stop offset="0" stop-color="#d9b85a" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#8b6d2d" stop-opacity=".08"/>
      <stop offset="1" stop-color="#081326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f4f5"/>
      <stop offset=".5" stop-color="#aebbc4"/>
      <stop offset="1" stop-color="#657785"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a1"/>
      <stop offset=".38" stop-color="#d8b84e"/>
      <stop offset="1" stop-color="#8e681e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <path d="M0 356 Q160 304 320 345 T640 328 V480 H0Z" fill="#030914" opacity=".72"/>
  <ellipse cx="320" cy="296" rx="258" ry="126" fill="url(#halo)"/>
  <ellipse cx="320" cy="303" rx="217" ry="91" fill="none" stroke="#7d91a0" stroke-width="3" opacity=".65"/>
  <ellipse cx="320" cy="303" rx="169" ry="68" fill="none" stroke="#d7b652" stroke-width="3" opacity=".9"/>
  <ellipse cx="320" cy="303" rx="113" ry="43" fill="none" stroke="#aebbc4" stroke-width="2" opacity=".72"/>
  <path d="M78 303 H562 M320 212 V394" stroke="#aebbc4" stroke-width="2" opacity=".32"/>
  <ellipse cx="320" cy="303" rx="74" ry="28" fill="#0a1a31" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="320" cy="303" r="18" fill="url(#silver)" stroke="#f5d66d" stroke-width="3"/>
  <path d="M320 281 L327 296 343 300 329 307 327 324 320 312 305 319 311 304 298 294 314 295Z" fill="#d8b84e" opacity=".95"/>
  <g transform="translate(320 125)">
    <circle r="62" fill="#071326" stroke="url(#silver)" stroke-width="5"/>
    <circle r="50" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <path d="M-27 -39 L0 -52 27 -39 27 10 Q0 42 -27 10Z" fill="#102b4a" stroke="#d8b84e" stroke-width="4"/>
    <text x="0" y="27" text-anchor="middle" fill="#f5d66d" font-family="Arial,sans-serif" font-size="76" font-weight="700">2</text>
  </g>
  <text x="320" y="52" text-anchor="middle" fill="#d8b84e" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="6">NINTENDO 64 ERA</text>
  <text x="320" y="430" text-anchor="middle" fill="url(#silver)" font-family="Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="4">POKÉMON STADIUM 2</text>
  <text x="320" y="456" text-anchor="middle" fill="#d8b84e" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="5">RECOMP EDITION</text>
</svg>
